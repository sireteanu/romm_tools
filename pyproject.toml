[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "romm-tools"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "watchdog>=4.0.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "flask>=3.0",
    "a2wsgi>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
